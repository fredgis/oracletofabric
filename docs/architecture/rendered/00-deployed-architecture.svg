<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="960" viewBox="0 0 1600 960" role="img" aria-labelledby="title description">
  <title id="title">Oracle to Fabric Demo deployed architecture</title>
  <desc id="description">A private Azure virtual network contains an Oracle Linux virtual machine, a Windows Fabric gateway virtual machine, a Key Vault private endpoint, and outbound NAT. Azure Bastion provides administration. The gateway mirrors Oracle data into a Microsoft Fabric mirrored database and Lakehouse.</desc>
  <defs>
    <style>
      :root {
        --canvas: #F4F7FB;
        --surface: #FFFFFF;
        --ink: #172033;
        --muted: #5D6978;
        --rule: #C8D2DF;
        --azure: #0078D4;
        --azure-soft: #EAF4FC;
        --private: #2E7D32;
        --private-soft: #EDF7EE;
        --oracle: #C74634;
        --oracle-soft: #FCEDEA;
        --fabric: #742774;
        --fabric-soft: #F7EEF9;
        --egress: #485769;
        --egress-soft: #EEF1F5;
      }
      .display { font: 700 34px "Segoe UI Variable Display", "Segoe UI", sans-serif; fill: var(--ink); letter-spacing: -0.02em; }
      .subtitle { font: 400 18px "Segoe UI Variable Text", "Segoe UI", sans-serif; fill: var(--muted); }
      .group-title { font: 700 22px "Segoe UI Variable Text", "Segoe UI", sans-serif; fill: var(--ink); }
      .group-meta { font: 600 15px "Cascadia Mono", Consolas, monospace; fill: var(--muted); }
      .card-title { font: 700 19px "Segoe UI Variable Text", "Segoe UI", sans-serif; fill: var(--ink); }
      .card-copy { font: 400 15px "Segoe UI Variable Text", "Segoe UI", sans-serif; fill: var(--muted); }
      .edge-label { font: 600 14px "Segoe UI Variable Text", "Segoe UI", sans-serif; fill: var(--muted); }
      .legend { font: 400 14px "Segoe UI Variable Text", "Segoe UI", sans-serif; fill: var(--muted); }
      .surface { fill: var(--surface); stroke: var(--rule); stroke-width: 1.5; }
      .data-line { fill: none; stroke: var(--ink); stroke-width: 2.5; marker-end: url(#arrow-data); }
      .control-line { fill: none; stroke: var(--azure); stroke-width: 2; stroke-dasharray: 8 7; marker-end: url(#arrow-control); }
      .secret-line { fill: none; stroke: var(--private); stroke-width: 2; stroke-dasharray: 7 6; marker-end: url(#arrow-secret); }
    </style>
    <marker id="arrow-data" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#172033"/>
    </marker>
    <marker id="arrow-control" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0078D4"/>
    </marker>
    <marker id="arrow-secret" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2E7D32"/>
    </marker>
  </defs>

  <rect width="1600" height="960" fill="var(--canvas)"/>

  <text x="56" y="60" class="display">Oracle to Fabric Demo</text>
  <text x="56" y="92" class="subtitle">Deployed architecture in Central US</text>
  <text x="1544" y="62" text-anchor="end" class="group-meta">FGI-ORACLE</text>

  <rect x="56" y="120" width="1488" height="112" rx="18" class="surface"/>
  <text x="82" y="151" class="group-meta">ADMINISTRATION</text>

  <g transform="translate(92 166)">
    <circle cx="22" cy="15" r="13" fill="none" stroke="var(--ink)" stroke-width="3"/>
    <path d="M3 53C5 34 13 29 22 29C31 29 39 34 41 53" fill="none" stroke="var(--ink)" stroke-width="3" stroke-linecap="round"/>
    <text x="58" y="18" class="card-title">Administrator</text>
    <text x="58" y="43" class="card-copy">Azure portal</text>
  </g>

  <path d="M330 186H410" class="control-line"/>
  <text x="370" y="174" text-anchor="middle" class="edge-label">HTTPS 443</text>

  <g transform="translate(438 158)">
    <path d="M0 17L21 38L0 59L10 69L42 38L10 7Z" fill="var(--azure)"/>
    <path d="M35 17L56 38L35 59L45 69L77 38L45 7Z" fill="#64B5F6"/>
    <text x="100" y="31" class="card-title">Bastion Developer</text>
    <text x="100" y="56" class="card-copy">Browser SSH and RDP</text>
  </g>

  <rect x="56" y="262" width="1040" height="548" rx="24" fill="var(--azure-soft)" stroke="var(--azure)" stroke-width="2.5"/>
  <text x="86" y="302" class="group-title">Azure resource group</text>
  <text x="1068" y="302" text-anchor="end" class="group-meta">FGI-ORACLE</text>

  <rect x="86" y="326" width="980" height="424" rx="20" fill="var(--private-soft)" stroke="var(--private)" stroke-width="2"/>
  <text x="112" y="362" class="group-title">demo-oracle-vnet</text>
  <text x="1038" y="362" text-anchor="end" class="group-meta">10.60.0.0/16</text>

  <rect x="112" y="392" width="272" height="236" rx="16" class="surface"/>
  <rect x="112" y="392" width="272" height="8" rx="4" fill="var(--oracle)"/>
  <text x="132" y="430" class="group-meta">ORACLE SUBNET</text>
  <text x="364" y="430" text-anchor="end" class="group-meta">10.60.1.0/24</text>
  <rect x="132" y="456" width="62" height="62" rx="12" fill="var(--oracle-soft)" stroke="var(--oracle)"/>
  <ellipse cx="163" cy="474" rx="18" ry="7" fill="none" stroke="var(--oracle)" stroke-width="3"/>
  <path d="M145 474V498C145 502 153 505 163 505C173 505 181 502 181 498V474" fill="none" stroke="var(--oracle)" stroke-width="3"/>
  <path d="M145 486C145 490 153 493 163 493C173 493 181 490 181 486" fill="none" stroke="var(--oracle)" stroke-width="3"/>
  <text x="212" y="474" class="card-title">demo-oracle-vm</text>
  <text x="212" y="498" class="card-copy">Oracle Linux 9.8</text>
  <text x="132" y="550" class="card-copy">Oracle AI Database Free</text>
  <text x="132" y="574" class="card-copy">Schema: DEMO_DW</text>
  <text x="132" y="598" class="card-copy">Private IP only</text>

  <rect x="414" y="392" width="300" height="236" rx="16" class="surface"/>
  <rect x="414" y="392" width="300" height="8" rx="4" fill="var(--azure)"/>
  <text x="434" y="430" class="group-meta">GATEWAY SUBNET</text>
  <text x="694" y="430" text-anchor="end" class="group-meta">10.60.2.0/24</text>
  <rect x="434" y="456" width="62" height="62" rx="12" fill="var(--azure-soft)" stroke="var(--azure)"/>
  <rect x="449" y="471" width="13" height="13" fill="var(--azure)"/>
  <rect x="467" y="471" width="13" height="13" fill="var(--azure)"/>
  <rect x="449" y="489" width="13" height="13" fill="var(--azure)"/>
  <rect x="467" y="489" width="13" height="13" fill="var(--azure)"/>
  <text x="514" y="474" class="card-title">Gateway VM</text>
  <text x="514" y="498" class="card-copy">Windows Server 2022</text>
  <text x="434" y="550" class="card-copy">On-premises data gateway</text>
  <text x="434" y="574" class="card-copy">Oracle Net 1521 to Oracle VM</text>
  <text x="434" y="598" class="card-copy">Private IP only</text>

  <rect x="744" y="392" width="294" height="236" rx="16" class="surface"/>
  <rect x="744" y="392" width="294" height="8" rx="4" fill="var(--private)"/>
  <text x="764" y="430" class="group-meta">PRIVATE ENDPOINT</text>
  <text x="1018" y="430" text-anchor="end" class="group-meta">10.60.3.0/24</text>
  <path d="M793 458L821 470V491C821 510 810 522 793 530C776 522 765 510 765 491V470Z" fill="var(--private-soft)" stroke="var(--private)" stroke-width="3"/>
  <circle cx="793" cy="487" r="7" fill="none" stroke="var(--private)" stroke-width="3"/>
  <path d="M793 494V507" stroke="var(--private)" stroke-width="3" stroke-linecap="round"/>
  <text x="840" y="474" class="card-title">Key Vault</text>
  <text x="840" y="498" class="card-copy">Private Endpoint</text>
  <text x="764" y="550" class="card-copy">Public network disabled</text>
  <text x="764" y="574" class="card-copy">Deployment secrets</text>
  <text x="764" y="598" class="card-copy">Private DNS</text>

  <rect x="414" y="650" width="300" height="86" rx="14" fill="var(--egress-soft)" stroke="var(--egress)" stroke-width="1.5"/>
  <path d="M443 692H474M466 684L474 692L466 700" fill="none" stroke="var(--egress)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="494" y="680" class="card-title">NAT Gateway</text>
  <text x="494" y="704" class="card-copy">One outbound IP</text>
  <text x="494" y="726" class="card-copy">No inbound path</text>

  <text x="112" y="786" class="group-meta">SUBNET NSGS · PRIVATE DNS · MANAGED IDENTITIES</text>

  <rect x="1128" y="262" width="416" height="548" rx="24" fill="var(--fabric-soft)" stroke="var(--fabric)" stroke-width="2.5"/>
  <text x="1158" y="302" class="group-title">Microsoft Fabric</text>
  <text x="1514" y="302" text-anchor="end" class="group-meta">FGI-ORACLE · F16</text>

  <rect x="1162" y="364" width="348" height="164" rx="16" class="surface"/>
  <rect x="1162" y="364" width="348" height="8" rx="4" fill="var(--fabric)"/>
  <ellipse cx="1210" cy="420" rx="22" ry="9" fill="var(--fabric-soft)" stroke="var(--fabric)" stroke-width="3"/>
  <path d="M1188 420V466C1188 472 1198 476 1210 476C1222 476 1232 472 1232 466V420" fill="none" stroke="var(--fabric)" stroke-width="3"/>
  <path d="M1188 443C1188 449 1198 453 1210 453C1222 453 1232 449 1232 443" fill="none" stroke="var(--fabric)" stroke-width="3"/>
  <text x="1260" y="418" class="card-title">DemoOracleMirror</text>
  <text x="1260" y="444" class="card-copy">Initial snapshot</text>
  <text x="1260" y="468" class="card-copy">LogMiner CDC</text>
  <text x="1260" y="492" class="card-copy">Delta tables in OneLake</text>

  <rect x="1162" y="576" width="348" height="164" rx="16" class="surface"/>
  <rect x="1162" y="576" width="348" height="8" rx="4" fill="var(--fabric)"/>
  <path d="M1187 644L1210 622L1233 644V677H1187Z" fill="var(--fabric-soft)" stroke="var(--fabric)" stroke-width="3" stroke-linejoin="round"/>
  <path d="M1195 677C1202 670 1209 670 1216 677C1223 684 1230 684 1237 677" fill="none" stroke="var(--azure)" stroke-width="3" stroke-linecap="round"/>
  <text x="1260" y="630" class="card-title">DemoLakehouse</text>
  <text x="1260" y="656" class="card-copy">Schema-enabled</text>
  <text x="1260" y="680" class="card-copy">Tables / DEMO_DW</text>
  <text x="1260" y="704" class="card-copy">Five OneLake shortcuts</text>

  <path d="M610 214V262" class="control-line"/>
  <text x="630" y="248" class="edge-label">SSH 22 / RDP 3389 to private VMs</text>

  <path d="M414 510H384" class="data-line"/>
  <path d="M714 510H744" class="secret-line"/>

  <path d="M564 628V650" class="data-line"/>

  <path d="M714 693H1108V446H1162" class="data-line"/>
  <rect x="802" y="677" width="206" height="28" rx="14" fill="var(--canvas)"/>
  <text x="905" y="696" text-anchor="middle" class="edge-label">Azure Relay + HTTPS 443</text>
  <text x="1122" y="432" text-anchor="end" class="edge-label">Oracle connection</text>

  <path d="M1336 528V576" class="data-line"/>
  <text x="1360" y="557" class="edge-label">OneLake shortcuts</text>

  <line x1="56" y1="862" x2="1544" y2="862" stroke="var(--rule)" stroke-width="1.5"/>
  <line x1="78" y1="905" x2="130" y2="905" stroke="var(--ink)" stroke-width="2.5"/>
  <text x="146" y="910" class="legend">Data or service path</text>
  <line x1="382" y1="905" x2="434" y2="905" stroke="var(--azure)" stroke-width="2" stroke-dasharray="8 7"/>
  <text x="450" y="910" class="legend">Administration</text>
  <line x1="650" y1="905" x2="702" y2="905" stroke="var(--private)" stroke-width="2" stroke-dasharray="7 6"/>
  <text x="718" y="910" class="legend">Private secret retrieval</text>
  <text x="1544" y="910" text-anchor="end" class="legend">Both VMs private · NAT outbound only</text>
</svg>
