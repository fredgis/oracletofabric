metadata:
  title: Oracle to Fabric Demo
  view_type: target
  deployment_status: not_deployed
  verified_on: 2026-09-14
  sensitive_identifiers_stored: false
  source_of_truth:
    - ../../../README.md
    - https://www.oracle.com/database/free/
    - https://learn.microsoft.com/en-us/azure/bastion/quickstart-host-portal
    - https://learn.microsoft.com/en-us/fabric/mirroring/oracle
    - https://learn.microsoft.com/en-us/fabric/mirroring/oracle-limitations

scope:
  azure_tenant:
    id: not_stored
    access_verified: true
  subscription:
    id: not_stored
    state: enabled
    owner_access_verified: true
  region:
    azure_region: centralus
    fabric_region: Central US
  resource_group:
    name: FGI-ORACLE
    exists: true
    empty: true
    locked: false
  fabric:
    workspace: FGI-ORACLE
    workspace_admin_verified: true
    capacity_sku: F16
    capacity_state: Active

naming:
  prefix: demo
  vnet: demo-oracle-vnet
  oracle_vm: demo-oracle-vm
  gateway_vm: demo-fabric-gateway-vm
  bastion: demo-bastion
  nat_gateway: demo-egress-nat
  key_vault: demo-oracle-kv-unique
  mirrored_database: Demo Oracle Mirror
  lakehouse: Demo Lakehouse
  oracle_schema: DEMO_DW

network:
  vnet:
    name: demo-oracle-vnet
    address_space: 10.60.0.0/16
    overlaps_existing_azure_vnets: false
    status: planned
  peerings: []
  vpn_gateways: []
  subnets:
    - name: snet-demo-oracle
      cidr: 10.60.1.0/24
      purpose: Oracle Linux VM and Oracle AI Database Free
      public_ip_allowed: false
    - name: snet-demo-gateway
      cidr: 10.60.2.0/24
      purpose: Windows VM and on-premises data gateway
      public_ip_allowed: false
    - name: snet-demo-private-endpoints
      cidr: 10.60.3.0/24
      purpose: Key Vault Private Endpoint
      public_ip_allowed: false
  administration:
    access_method: Azure Bastion Developer
    client: Azure portal browser session
    dedicated_subnet_required: false
    bastion_public_ip_required: false
    vpn_required: false
    bastion:
      sku: Developer
      architecture: shared_pool
      cost: free
      intended_use: dev_test
  egress:
    method: Azure NAT Gateway
    name: demo-egress-nat
    public_ip_count: 1
    public_ip_scope: outbound_only
    inbound_connections_supported: false
    shared_egress_available: false
    default_outbound_access: disabled
    required_destinations:
      - Oracle public package repositories
      - Microsoft Entra ID
      - Azure Relay
      - Microsoft Fabric
      - Microsoft update and gateway endpoints
  private_endpoints:
    - service: Azure Key Vault
      subnet: snet-demo-private-endpoints
      status: planned
    - service: Microsoft Fabric
      status: not_used_for_oracle_mirroring
  dns:
    private_zones:
      - privatelink.vaultcore.azure.net
    oracle_name: demo-oracle.internal
    resolver: Azure-provided DNS

security_controls:
  ingress:
    internet_to_oracle_vm: blocked
    internet_to_gateway_vm: blocked
    internet_to_oracle_listener: blocked
    nat_public_ip_to_workloads: impossible
  subnet_controls:
    oracle_subnet_nsg: planned
    gateway_subnet_nsg: planned
    private_endpoint_subnet_policy: planned
    denied_flow_logging: planned
  secrets:
    store: Azure Key Vault
    generation: deployment_time
    committed_to_repository: false
    oracle_credentials: generated
    gateway_recovery_key: generated
    gateway_certificate: generated
  identities:
    deployment_identity:
      type: certificate_backed_service_principal
      certificate_store: Azure Key Vault
      repository_secret_required: false
    oracle_vm_managed_identity: planned
    gateway_vm_managed_identity: planned
    fabric_service_principal_settings_verified: true
    oracle_mirroring_account:
      authentication: basic
      credential_store: Azure Key Vault

components:
  administration:
    - id: administrator
      type: browser_client
      path: Azure portal to Bastion Developer
  azure:
    - id: bastion
      name: demo-bastion
      type: azure_bastion
      sku: Developer
      public_ip: false
      dedicated_subnet: false
    - id: oracle-vm
      name: demo-oracle-vm
      type: azure_linux_vm
      os: Oracle Linux 9.8 Gen2 x64
      public_ip: false
      size: Standard_D2as_v7
    - id: oracle-data-disk
      type: azure_managed_disk
      size: planned
    - id: gateway-vm
      name: demo-fabric-gateway-vm
      type: azure_windows_vm
      public_ip: false
      size: Standard_D4as_v7
    - id: opdg
      type: on_premises_data_gateway
      mode: standard
      host: gateway-vm
      registration: unattended
    - id: key-vault
      type: azure_key_vault
      public_network_access: disabled
    - id: nat-gateway
      name: demo-egress-nat
      type: azure_nat_gateway
      public_ip_count: 1
      inbound: false
  oracle:
    - id: oracle-rpm
      source: Oracle public Linux package
      product: Oracle AI Database 26ai Free
      version: pinned_at_deployment
      checksum: verified_at_deployment
      registry_token_required: false
    - id: oracle-database
      host: oracle-vm
      installation: native_rpm
      storage: oracle-data-disk
      listener_port: configured_at_deployment
      write_mode: required
      archive_log: required
      logminer: required
      supplemental_logging: required
  fabric:
    - id: fabric-workspace
      name: FGI-ORACLE
      type: workspace
      capacity: active_F16
    - id: mirrored-database
      name: Demo Oracle Mirror
      type: oracle_mirrored_database
      storage: OneLake
    - id: sql-analytics-endpoint
      type: sql_analytics_endpoint
    - id: lakehouse
      name: Demo Lakehouse
      type: fabric_lakehouse
    - id: onelake-shortcuts
      type: shortcuts
      access: read_only_source

data_model:
  schema: DEMO_DW
  tables:
    - name: DIM_DATE
      target_rows: 731
      key: DATE_KEY
    - name: DIM_CUSTOMER
      target_rows: 500
      key: CUSTOMER_KEY
    - name: DIM_PRODUCT
      target_rows: 100
      key: PRODUCT_KEY
    - name: DIM_STORE
      target_rows: 20
      key: STORE_KEY
    - name: FACT_SALES
      target_rows: 25000
      key: SALES_KEY
  allowed_types:
    - NUMBER with explicit precision and scale
    - VARCHAR2
    - CHAR
    - DATE
  excluded_types:
    - LOB
    - object types
    - spatial types
    - NUMBER without precision

traffic_flows:
  - id: administrator-to-bastion
    source: administrator
    destination: bastion
    direction: management
    protocol: HTTPS
    port: 443
    purpose: Browser-based Bastion Developer session
  - id: bastion-to-oracle-vm
    source: bastion
    destination: oracle-vm
    direction: private
    protocol: SSH
    port: default_or_configured
    purpose: Linux administration
  - id: bastion-to-gateway-vm
    source: bastion
    destination: gateway-vm
    direction: private
    protocol: RDP
    port: default_or_configured
    purpose: Windows administration
  - id: opdg-to-oracle
    source: opdg
    destination: oracle-database
    direction: private
    protocol: Oracle Net
    port: configured_at_deployment
    purpose: Snapshot and LogMiner CDC reads
  - id: oracle-package-download
    source: oracle-vm
    destination: Oracle public package repositories
    direction: outbound_via_nat
    protocol: HTTPS
    port: 443
    purpose: Download pinned Oracle RPM
  - id: opdg-to-fabric
    source: opdg
    destination: fabric-workspace
    direction: outbound_via_nat
    protocol: HTTPS and Azure Relay
    port: 443_when_https_mode_is_forced
    purpose: Oracle Mirroring publisher traffic
  - id: vm-to-key-vault
    source: oracle-vm_and_gateway-vm
    destination: key-vault
    direction: private
    protocol: HTTPS
    port: 443
    purpose: Retrieve generated secrets and certificate
  - id: mirror-to-lakehouse
    source: mirrored-database
    destination: lakehouse
    direction: onelake
    protocol: OneLake shortcut
    port: service_managed
    purpose: Read mirrored tables from Demo Lakehouse

trust_boundaries:
  - name: Azure management plane
    contains:
      - Azure portal
      - Bastion Developer shared pool
  - name: Demo private VNet
    contains:
      - oracle-vm
      - gateway-vm
      - opdg
      - key-vault-private-endpoint
  - name: Outbound-only public egress
    contains:
      - NAT Gateway public IP
      - Oracle package endpoints
      - Azure Relay
      - Microsoft Fabric endpoints
  - name: Microsoft Fabric workspace
    contains:
      - Demo Oracle Mirror
      - sql-analytics-endpoint
      - Demo Lakehouse

confirmed_facts:
  - Azure Bastion Developer is free and requires no public IP or AzureBastionSubnet.
  - Bastion Developer can be created through Azure CLI without a portal deployment step.
  - No VPN Gateway is required.
  - Neither workload VM has a public IP.
  - One outbound-only NAT public IP is required because no shared egress exists.
  - Oracle AI Database Free can be installed from the public Oracle Linux RPM.
  - Oracle Mirroring requires a standard on-premises data gateway.
  - Fabric tenant settings allow service principals to call the required APIs.
  - Fabric creates a Mirrored Database in OneLake and a SQL analytics endpoint.
  - Demo Lakehouse consumes mirrored tables through OneLake shortcuts.

assumptions:
  - This is a non-production Demo.
  - The administrator activation remains valid for the deployment window.
  - Gateway HTTPS mode is enabled where supported.
  - The selected NAT public IP is used only for outbound connections.

external_failure_conditions:
  - Administrator activation expires before role and identity setup completes.
  - Conditional Access requires a new interactive challenge.
  - Azure, Oracle, or Fabric service availability blocks automation.

unresolved_at_deployment:
  - Exact Oracle RPM version and checksum
  - Generated globally unique Key Vault name
  - Final Oracle listener port
  - Final administrator source IP for Bastion Developer ACL
